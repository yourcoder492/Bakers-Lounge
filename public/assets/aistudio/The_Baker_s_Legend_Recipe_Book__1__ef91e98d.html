<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Baker’s Legend Recipe Book</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6ec;--ink:#2b1d16;--muted:#6d5d52;--card:#fffdf8;--line:#dfe4d3;--accent:#b81f55;--on-accent:#fff;--tint-s:70%;--tint-l:90%;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1411;--ink:#f6ece2;--muted:#b8a799;--card:#2a1f1a;--line:#3d2f27;--accent:#ff7aa5;--on-accent:#2b1d16;--tint-s:28%;--tint-l:24%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1411;--ink:#f6ece2;--muted:#b8a799;--card:#2a1f1a;--line:#3d2f27;--accent:#ff7aa5;--on-accent:#2b1d16;--tint-s:28%;--tint-l:24%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
.hero{padding:40px 20px 8px;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;max-width:14ch}
.hero p{max-width:52ch;color:var(--muted);margin:14px 0 0}
.shelf{display:flex;gap:6px;margin:26px 0 4px;overflow-x:auto;padding:6px 2px 10px}
.shelf svg{width:84px;height:84px;flex:none;animation:bob 4s ease-in-out infinite}
.shelf svg:nth-child(2n){animation-delay:-1.3s}.shelf svg:nth-child(3n){animation-delay:-2.4s}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.shelf svg{animation:none}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 20px;border-bottom:1px solid var(--line)}
.bar>div{max-width:1100px;margin:auto}
input[type=search]{width:100%;font:inherit;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;font:inherit;font-weight:600;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:18px 20px 60px}
.count{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.art{background:hsl(var(--h) var(--tint-s) var(--tint-l));display:grid;place-items:center;padding:18px;height:150px}
.art svg{height:118px;width:118px}
.card .tx{padding:14px 16px 16px}
.card h3{font-size:1.2rem}
.card small{display:block;color:var(--muted);margin-top:6px}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--accent);font-size:1.15rem;cursor:pointer}
.empty{padding:40px 0;color:var(--muted)}
.veil{position:fixed;inset:0;background:rgba(20,10,6,.6);display:none;z-index:20;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 14px max(16px,env(safe-area-inset-bottom,0px))}
.veil.on{display:block}
.sheet{max-width:720px;margin:auto;background:var(--card);border-radius:26px;overflow:hidden}
.sheet .art{height:220px}.sheet .art svg{height:180px;width:180px}
.body{padding:22px 24px 28px}
.body h2{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.meta span{background:hsl(var(--h) var(--tint-s) var(--tint-l));border-radius:999px;padding:5px 13px;font-size:.9rem;font-weight:600}
.body h3{font-size:1.3rem;margin:24px 0 10px}
.ing label{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ing input{accent-color:var(--accent);width:18px;height:18px;margin-top:3px;flex:none}
.ing input:checked+span{text-decoration:line-through;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:14px;padding:12px;border-radius:16px;cursor:pointer;margin-bottom:6px;border:1.5px solid var(--line)}
ol.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
ol.steps li.done{opacity:.55}ol.steps li.done span{text-decoration:line-through}
.tip{margin-top:22px;padding:16px 18px;border-radius:18px;background:hsl(var(--h) var(--tint-s) var(--tint-l))}
.tip b{font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
footer{text-align:center;color:var(--muted);padding:10px 20px 40px}
@media print{.bar,.hero,.grid,.row,footer{display:none}.veil{position:static;background:none;display:block}}

.art svg{filter:drop-shadow(0 6px 6px rgba(60,30,10,.18))}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.pt{margin:0 0 12px;color:var(--muted);font-size:.9rem;font-weight:600}
ol.steps{position:relative}
ol.steps li{align-items:center;position:relative;background:var(--card)}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:27px;top:100%;height:6px;border-left:2px dashed var(--accent)}
ol.steps li::before{display:none}
.si{flex:none;width:64px;height:64px;border-radius:18px;background:hsl(var(--h) var(--tint-s) var(--tint-l));display:grid;place-items:center;position:relative;color:var(--ink)}
.si svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.si b{position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.8rem}
.sb{display:flex;flex-direction:column;gap:6px;min-width:0}
.sb em{font-style:normal;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cp{display:flex;gap:6px;flex-wrap:wrap}
.cp u{text-decoration:none;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:hsl(var(--h) var(--tint-s) var(--tint-l))}
ol.steps li.done .si{opacity:.6}
.oven{display:inline-flex;align-items:center;gap:6px}.oven svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
</style></head><body>

const SS='stroke="#4a2e1c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
function pal(n){n=n.toLowerCase();
 if(/chocolate|brownie|lava|cocoa|pudding|tiramisu/.test(n))return['#7a4a2b','#3f2214'];
 if(/red velvet/.test(n))return['#c2272d','#fff4ee'];
 if(/lemon/.test(n))return['#f2d04a','#fff3b0'];
 if(/carrot/.test(n))return['#e08a3c','#fff1e0'];
 if(/blueberry/.test(n))return['#7a67c2','#f6f0ff'];
 if(/banana|peanut|oat|ginger|multigrain|whole wheat|rusk/.test(n))return['#c98e4f','#f1d9b0'];
 if(/caramel/.test(n))return['#e0a24a','#b8601f'];
 if(/vanilla|panna|cheesecake|wedding/.test(n))return['#f0d9a8','#fff6ee'];
 return['#e3a653','#f4b6c9']}
function kind(n){n=n.toLowerCase();const K=[['donut',/doughnut/],['eclair',/clair|cream puff|cream roll|horn/],['cupcake',/cupcake|muffin/],['cup',/cheesecake|tiramisu|crème|creme|panna|pudding|lava/],['long',/baguette|garlic bread|straws|rusk/],['croissant',/croissant|danish/],['loaf',/loaf|banana bread|tea cake/],['misc',/pancake|waffle/],['cookie',/cookie|biscuit|shortbread|cracker/],['cake',/cake|brownie|sponge|swiss roll/],['bun',/bun|roll|pita|naan|bagel|pretzel|focaccia|sandwich/],['pie',/pie|tart|quiche|turnover|patties|sausage|puffs/],['pizza',/pizza/],['bowl',/frosting|ganache/]];
 for(const[k,r]of K)if(r.test(n))return k;return'misc'}
function art(r){const[b,t]=pal(r.n),k=kind(r.n),v=(x)=>`<svg viewBox="0 0 100 100" role="img" aria-label="${esc(r.n)} illustration" ${SS}>${x}</svg>`;
 const I=ICON;
 switch(k){
 case'loaf':return I.Breads.replace('#e3a653',b);
 case'croissant':return I.Pastries.replace('#efbd63',b);
 case'pizza':return I['Savory Items'];
 case'donut':return I['Sweet Snacks & Desserts'].replace('#e6a96a',b==='#e3a653'?'#e6a96a':b).replace('#f08cb2',t);
 case'cookie':return I['Biscuits & Cookies'].replace('#dca061',b);
 case'misc':return I.Others.replace('#e5a94e',b);
 case'cake':return I.Cakes.replace('#f4b6c9',b==='#e3a653'?'#f4b6c9':b).replace('#fde3ea',t==='#f4b6c9'?'#fde3ea':t);
 case'long':return v(`<g transform="rotate(-28 50 50)"><rect x="6" y="37" width="88" height="26" rx="13" fill="${b}"/><path d="M24 41l8 18M42 41l8 18M60 41l8 18" fill="none" stroke="#a9692a"/></g>`);
 case'bun':return v(`<path d="M12 64c0-27 17-42 38-42s38 15 38 42c0 8-6 12-12 12H24c-6 0-12-4-12-12z" fill="${b}"/><path d="M12 64h76" fill="none" stroke="#a9692a"/><g fill="#fff6dc" stroke="none"><ellipse cx="38" cy="40" rx="4" ry="2" transform="rotate(-20 38 40)"/><ellipse cx="54" cy="33" rx="4" ry="2"/><ellipse cx="66" cy="45" rx="4" ry="2" transform="rotate(25 66 45)"/><ellipse cx="48" cy="50" rx="4" ry="2"/></g>`);
 case'pie':return v(`<ellipse cx="50" cy="62" rx="40" ry="22" fill="${b}"/><ellipse cx="50" cy="54" rx="35" ry="19" fill="${b}" stroke="#a9692a"/><path d="M26 48l38 14M38 38l36 14M28 62l30-24M44 70l30-22" fill="none" stroke="#a9692a"/><path d="M12 58q4 10 10 14M88 58q-4 10-10 14" fill="none" stroke="#a9692a"/>`);
 case'cupcake':return v(`<path d="M24 56c-6-16 8-18 12-26 4-9 24-9 28 0 4 8 18 10 12 26z" fill="${t==='#f4b6c9'?'#f4b6c9':t}"/><path d="M26 54h48l-7 30H33z" fill="${b}"/><path d="M40 56l3 28M50 56v28M60 56l-3 28" fill="none" stroke="#a9692a"/><circle cx="50" cy="22" r="5" fill="#d6284f"/>`);
 case'eclair':return v(`<rect x="8" y="40" width="84" height="28" rx="14" fill="${b==='#e3a653'?'#eab764':b}"/><path d="M13 46q37-12 74 0v8q-37 9-74 0z" fill="${t==='#f4b6c9'?'#5a3322':t}"/><path d="M22 70q28 8 56 0" fill="none" stroke="#fff" stroke-width="3"/>`);
 case'cup':return v(`<path d="M20 38h60l-6 42c-1 5-4 7-8 7H34c-4 0-7-2-8-7z" fill="#f6efe4"/><ellipse cx="50" cy="38" rx="30" ry="9" fill="${b}"/><path d="M30 42q20 6 40 0" fill="none" stroke="${t}" stroke-width="4"/><circle cx="50" cy="30" r="5" fill="#d6284f"/>`);
 case'bowl':return v(`<path d="M14 48h72c0 24-15 38-36 38S14 72 14 48z" fill="#efe7dc"/><path d="M20 48c0-14 12-20 20-24 6-4 14-4 20 0 8 4 20 10 20 24z" fill="${t==='#f4b6c9'?'#fbd0de':t}"/><path d="M34 40q16-8 32 0" fill="none" stroke="#fff" stroke-width="3"/>`);}
}
const P={
mix:'<path d="M3 11h18c0 5-3.5 8-9 8s-9-3-9-8z"/><path d="M15 3l-4 8M9 4l1 7"/>',
knead:'<path d="M3 17c0-5 4-9 9-9s9 4 9 9z"/><path d="M7 5l-2-3M12 4V1M17 5l2-3"/>',
clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
snow:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/>',
pin:'<rect x="6" y="9" width="12" height="6" rx="2"/><path d="M2 12h4M18 12h4"/>',
pipe:'<path d="M4 4h16l-5 11H9z"/><path d="M12 15v6"/>',
oven:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><rect x="7" y="12" width="10" height="5" rx="1"/><path d="M7 6.5h.01M11 6.5h.01"/>',
pot:'<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M9 2c-1 2 1 2 0 4M14 2c-1 2 1 2 0 4"/>',
brush:'<path d="M15 3l6 6-8 8c-2 2-6 2-8 0 2 0 3-2 3-4z"/><path d="M9 11l4 4"/>'};
const SR=[['oven',/\bbake|oven|preheat|hot (pan|tray)|puff within/],['knead',/knead/],['snow',/chill|refrigerat/],['clock',/proof|rest|rise|cool|set\b|soak|overnight/],['pipe',/pipe|fill |filling/],['pin',/roll|shape|divide|cut|flatten|wind|line |stack|slice|fold in|seal/],['pot',/cook|boil|heat|saut|simmer|pour|steam/],['brush',/brush|glaze|frost|dust|spread|sprinkle|dip|decorate|coat/],['mix',/mix|whisk|beat|cream|stir|fold|combine|rub|toss|sift/]];
const LB={oven:'Bake',knead:'Knead',snow:'Chill',clock:'Rest',pipe:'Fill',pin:'Shape',pot:'Cook',brush:'Finish',mix:'Mix'};
function stp(x,i){let best='mix',bi=1e9;const l=x.toLowerCase();for(const[k,re]of SR){const m=l.search(re);if(m>=0&&m<bi){bi=m;best=k}}
 const ch=[...x.matchAll(/(\d+(?:\.\d+)?(?:\s?[-–]\s?\d+)?)\s*(min|hr|hours?)\b/gi)].map(m=>'⏱ '+m[1]+' '+m[2]).concat([...x.matchAll(/(\d+)\s?°C/g)].map(m=>'🌡 '+m[1]+'°C'));
 return `<li tabindex="0"><div class="si"><b>${i+1}</b><svg viewBox="0 0 24 24" aria-hidden="true">${P[best]}</svg></div><div class="sb"><em>${LB[best]}</em><span>${esc(x)}</span>${ch.length?'<div class="cp">'+ch.map(c=>'<u>'+esc(c)+'</u>').join('')+'</div>':''}</div></li>`}
function upd(){const sh=$('#sheet');if(!sh)return;const L=sh.querySelectorAll('ol.steps li'),d=sh.querySelectorAll('ol.steps li.done').length,A=sh.querySelectorAll('.ing input'),g=[...A].filter(a=>a.checked).length,pg=$('#pg');if(!pg)return;
 pg.style.width=(L.length?d/L.length*100:0)+'%';$('#pt').textContent=d===L.length&&L.length?'All steps done. Enjoy your bake!':`Ingredients ${g}/${A.length} · Steps ${d}/${L.length}`}
document.addEventListener('change',e=>{if(e.target.matches('.ing input'))upd()});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch(e){}
const keep=()=>{try{localStorage.setItem('fav',JSON.stringify([...fav]))}catch(e){}};
let cat='All',q='';
$('#shelf').innerHTML=Object.keys(CATS).map(k=>ICON[k].replace('<svg','<svg style="--h:'+CATS[k].h+'"')).join('');
const names=['All',...Object.keys(CATS),'Saved'];
function chips(){$('#chips').innerHTML=names.map(n=>`<button class="chip" aria-pressed="${n===cat}" data-c="${esc(n)}">${n==='Saved'?'♥ Saved':esc(n)}</button>`).join('')}
function list(){q=$('#q').value.trim().toLowerCase();
 return R.filter(r=>(cat==='All'||(cat==='Saved'?fav.has(r.id):r.c===cat))&&(!q||(r.n+' '+r.c+' '+r.i.join(' ')).toLowerCase().includes(q)))}
function render(){chips();const L=list();$('#count').textContent=L.length+(L.length===1?' recipe':' recipes');
 $('#grid').innerHTML=L.length?L.map(r=>`<div class="card" style="--h:${CATS[r.c].h}"><button class="card" style="all:unset;cursor:pointer;display:block;width:100%" data-o="${r.id}" aria-label="Open ${esc(r.n)}"><div class="art">${art(r)}</div><div class="tx"><h3>${esc(r.n)}</h3><small>${esc(r.y)} · ${esc(r.b)}</small></div></button><button class="heart" data-f="${r.id}" aria-label="Save ${esc(r.n)}" aria-pressed="${fav.has(r.id)}">${fav.has(r.id)?'♥':'♡'}</button></div>`).join(''):'<p class="empty">Nothing matches yet. Try another word, or pick All.</p>'}
function open(id){const r=R.find(x=>x.id==id);if(!r)return;const t=CATS[r.c].t[r.id%3];
 $('#sheet').style.setProperty('--h',CATS[r.c].h);
 $('#sheet').innerHTML=`<div class="art">${art(r)}</div><div class="body"><h2>${esc(r.n)}</h2><div class="meta"><span>${esc(r.c)}</span><span>Makes ${esc(r.y)}</span><span class="oven"><svg viewBox="0 0 24 24">${P.oven}</svg>${esc(r.b)}</span></div>
 <h3>Ingredients</h3><div class="ing">${r.i.map(x=>`<label><input type="checkbox"><span>${esc(x)}</span></label>`).join('')}</div>
 <h3>Method, step by step</h3><div class="prog"><i id="pg"></i></div><p class="pt" id="pt"></p><ol class="steps">${r.m.map(stp).join('')}</ol>
 <div class="tip"><b>Baker’s tip</b><br>${esc(t)}</div>
 <div class="row"><button class="btn main" data-f="${r.id}">${fav.has(r.id)?'♥ Saved':'♡ Save recipe'}</button><button class="btn" onclick="print()">Print</button><button class="btn" data-x="1">Close</button></div></div>`;
 $('#veil').classList.add('on');$('#veil').scrollTop=0;upd();document.body.style.overflow='hidden'}
function close(){$('#veil').classList.remove('on');document.body.style.overflow=''}
document.addEventListener('click',e=>{const t=e.target;
 const f=t.closest('[data-f]');if(f){const id=+f.dataset.f;fav.has(id)?fav.delete(id):fav.add(id);keep();if(f.classList.contains('btn'))f.textContent=fav.has(id)?'♥ Saved':'♡ Save recipe';render();return}
 const o=t.closest('[data-o]');if(o){open(o.dataset.o);return}
 const c=t.closest('[data-c]');if(c){cat=c.dataset.c;render();return}
 const li=t.closest('ol.steps li');if(li){li.classList.toggle('done');upd();return}
 if(t.id==='veil'||t.closest('[data-x]'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.key==='Enter'||e.key===' ')&&e.target.matches('ol.steps li')){e.preventDefault();e.target.classList.toggle('done');upd()}});
$('#q').addEventListener('input',render);
render();
const h=location.hash.replace('#','');if(/^r\d+$/.test(h))open(h.slice(1));
</script></body></html>
